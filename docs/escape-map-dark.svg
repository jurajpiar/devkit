<svg xmlns="http://www.w3.org/2000/svg" style="background:#0d1117;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" viewBox="0 0 1180 932" role="img" aria-label="Ten escape attempts, each stopped at the layer that blocks it: the guest policy files, the firewall with its boot hold, the egress proxy, or Lima and the hypervisor; and the one allowed path, HTTPS to an allowed host on port 443, logged.">
<rect width="1180" height="100%" fill="#0d1117"/><defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4e8ee"/></marker>
<marker id="arrow-allow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fc08a"/></marker>
</defs>
<g fill="rgba(228,232,238,0.06)">
<rect x="347" y="48" width="116" height="854" rx="4"/>
<rect x="487" y="48" width="116" height="854" rx="4"/>
<rect x="632" y="48" width="116" height="854" rx="4"/>
<rect x="782" y="48" width="116" height="854" rx="4"/>
<rect x="987" y="48" width="156" height="854" rx="4"/>
</g>
<text x="150" y="70" font-size="12.5" font-weight="600" fill="#e4e8ee" text-anchor="middle">Sandbox user process</text>
<text x="150" y="86" font-size="10.5" fill="#9aa5b6" text-anchor="middle">no sudo, no CAP_NET_ADMIN</text>
<text x="405" y="70" font-size="12.5" font-weight="600" fill="#e4e8ee" text-anchor="middle">Guest policy</text>
<text x="405" y="86" font-size="10.5" fill="#9aa5b6" text-anchor="middle">root-only files</text>
<text x="545" y="70" font-size="12.5" font-weight="600" fill="#e4e8ee" text-anchor="middle">Firewall</text>
<text x="545" y="86" font-size="10.5" fill="#9aa5b6" text-anchor="middle">iptables OUTPUT</text>
<text x="690" y="70" font-size="12.5" font-weight="600" fill="#e4e8ee" text-anchor="middle">Egress proxy</text>
<text x="690" y="86" font-size="10.5" fill="#9aa5b6" text-anchor="middle">uid devkit-proxy</text>
<text x="840" y="70" font-size="12.5" font-weight="600" fill="#e4e8ee" text-anchor="middle">Lima / hypervisor</text>
<text x="840" y="86" font-size="10.5" fill="#9aa5b6" text-anchor="middle">vz, no mounts</text>
<text x="1065" y="70" font-size="12.5" font-weight="600" fill="#e4e8ee" text-anchor="middle">Outside</text>
<text x="1065" y="86" font-size="10.5" fill="#9aa5b6" text-anchor="middle">internet / your Mac</text>
<line x1="935" y1="48" x2="935" y2="902" stroke="#e4e8ee" stroke-width="2" stroke-dasharray="6 4"/>
<text x="929" y="894" font-size="10.5" fill="#9aa5b6" text-anchor="end">Virtualization.framework boundary</text>
<text x="20" y="136" font-size="12.5" fill="#e4e8ee">HTTPS to an allowed host, port 443</text>
<line x1="312" y1="132" x2="995" y2="132" stroke="#4fc08a" stroke-width="2" marker-end="url(#arrow-allow)"/>
<text x="545" y="152" font-size="10.5" fill="#4fc08a" text-anchor="middle">proxy's uid:</text>
<text x="545" y="165" font-size="10.5" fill="#4fc08a" text-anchor="middle">accepted</text>
<text x="690" y="152" font-size="10.5" fill="#4fc08a" text-anchor="middle">allowed host and</text>
<text x="690" y="165" font-size="10.5" fill="#4fc08a" text-anchor="middle">port, logged</text>
<text x="1065" y="152" font-size="10.5" fill="#4fc08a" text-anchor="middle">internet</text>
<text x="20" y="206" font-size="12.5" fill="#e4e8ee">Direct connection to the internet</text>
<line x1="312" y1="202" x2="531" y2="202" stroke="#e4e8ee" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="545" cy="202" r="9" fill="#0d1117" stroke="#e8604a" stroke-width="2"/>
<path d="M540,197 L550,207 M550,197 L540,207" stroke="#e8604a" stroke-width="2"/>
<text x="545" y="226" font-size="10.5" fill="#e8604a" text-anchor="middle">not the proxy's uid:</text>
<text x="545" y="239" font-size="10.5" fill="#e8604a" text-anchor="middle">REJECT</text>
<text x="20" y="276" font-size="12.5" fill="#e4e8ee">Via the proxy to another host, or port 22</text>
<line x1="312" y1="272" x2="676" y2="272" stroke="#e4e8ee" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="690" cy="272" r="9" fill="#0d1117" stroke="#e8604a" stroke-width="2"/>
<path d="M685,267 L695,277 M695,267 L685,277" stroke="#e8604a" stroke-width="2"/>
<text x="690" y="296" font-size="10.5" fill="#e8604a" text-anchor="middle">allowlist, web ports</text>
<text x="690" y="309" font-size="10.5" fill="#e8604a" text-anchor="middle">only: 403</text>
<text x="20" y="346" font-size="12.5" fill="#e4e8ee">DNS query with data in the name</text>
<line x1="312" y1="342" x2="531" y2="342" stroke="#e4e8ee" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="545" cy="342" r="9" fill="#0d1117" stroke="#e8604a" stroke-width="2"/>
<path d="M540,337 L550,347 M550,337 L540,347" stroke="#e8604a" stroke-width="2"/>
<text x="545" y="366" font-size="10.5" fill="#e8604a" text-anchor="middle">port 53 only for the</text>
<text x="545" y="379" font-size="10.5" fill="#e8604a" text-anchor="middle">proxy; stub off</text>
<text x="545" y="392" font-size="10.5" fill="#9aa5b6" text-anchor="middle">(the proxy resolves names itself)</text>
<text x="20" y="416" font-size="12.5" fill="#e4e8ee">Reuse the proxy's DNS source port</text>
<line x1="312" y1="412" x2="531" y2="412" stroke="#e4e8ee" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="545" cy="412" r="9" fill="#0d1117" stroke="#e8604a" stroke-width="2"/>
<path d="M540,407 L550,417 M550,407 L540,417" stroke="#e8604a" stroke-width="2"/>
<text x="545" y="436" font-size="10.5" fill="#e8604a" text-anchor="middle">state trusted only for</text>
<text x="545" y="449" font-size="10.5" fill="#e8604a" text-anchor="middle">root and the proxy</text>
<text x="20" y="486" font-size="12.5" fill="#e4e8ee">Connect to your Mac (host.lima.internal)</text>
<line x1="312" y1="482" x2="531" y2="482" stroke="#e4e8ee" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="545" cy="482" r="9" fill="#0d1117" stroke="#e8604a" stroke-width="2"/>
<path d="M540,477 L550,487 M550,477 L540,487" stroke="#e8604a" stroke-width="2"/>
<text x="545" y="506" font-size="10.5" fill="#e8604a" text-anchor="middle">host rejected, for</text>
<text x="545" y="519" font-size="10.5" fill="#e8604a" text-anchor="middle">the proxy too</text>
<text x="545" y="532" font-size="10.5" fill="#9aa5b6" text-anchor="middle">(CONNECT to the host: 403 or 502)</text>
<text x="20" y="556" font-size="12.5" fill="#e4e8ee">Code planted to run at the next boot</text>
<line x1="312" y1="552" x2="531" y2="552" stroke="#e4e8ee" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="545" cy="552" r="9" fill="#0d1117" stroke="#e8604a" stroke-width="2"/>
<path d="M540,547 L550,557 M550,547 L540,557" stroke="#e8604a" stroke-width="2"/>
<text x="545" y="576" font-size="10.5" fill="#e8604a" text-anchor="middle">boot hold: no network</text>
<text x="545" y="589" font-size="10.5" fill="#e8604a" text-anchor="middle">until the firewall</text>
<text x="20" y="626" font-size="12.5" fill="#e4e8ee">Listen for your Mac to connect</text>
<line x1="312" y1="622" x2="826" y2="622" stroke="#e4e8ee" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="840" cy="622" r="9" fill="#0d1117" stroke="#e8604a" stroke-width="2"/>
<path d="M835,617 L845,627 M845,617 L835,627" stroke="#e8604a" stroke-width="2"/>
<text x="840" y="646" font-size="10.5" fill="#e8604a" text-anchor="middle">no port forwarded</text>
<text x="840" y="659" font-size="10.5" fill="#e8604a" text-anchor="middle">unless listed</text>
<text x="20" y="696" font-size="12.5" fill="#e4e8ee">Read or write your files</text>
<line x1="312" y1="692" x2="826" y2="692" stroke="#e4e8ee" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="840" cy="692" r="9" fill="#0d1117" stroke="#e8604a" stroke-width="2"/>
<path d="M835,687 L845,697 M845,687 L835,697" stroke="#e8604a" stroke-width="2"/>
<text x="840" y="716" font-size="10.5" fill="#e8604a" text-anchor="middle">nothing mounted;</text>
<text x="840" y="729" font-size="10.5" fill="#e8604a" text-anchor="middle">nothing copied back</text>
<text x="20" y="766" font-size="12.5" fill="#e4e8ee">Rewrite the policy or swap the proxy</text>
<line x1="312" y1="762" x2="391" y2="762" stroke="#e4e8ee" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="405" cy="762" r="9" fill="#0d1117" stroke="#e8604a" stroke-width="2"/>
<path d="M400,757 L410,767 M410,757 L400,767" stroke="#e8604a" stroke-width="2"/>
<text x="405" y="786" font-size="10.5" fill="#e8604a" text-anchor="middle">root-only files;</text>
<text x="405" y="799" font-size="10.5" fill="#e8604a" text-anchor="middle">proxy SHA-checked</text>
<text x="20" y="836" font-size="12.5" fill="#e4e8ee">Become root: sudo, or a kernel bug</text>
<line x1="312" y1="832" x2="391" y2="832" stroke="#e4e8ee" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="405" cy="832" r="9" fill="#0d1117" stroke="#e8604a" stroke-width="2"/>
<path d="M400,827 L410,837 M410,827 L400,837" stroke="#e8604a" stroke-width="2"/>
<text x="405" y="856" font-size="10.5" fill="#e8604a" text-anchor="middle">no sudo; io_uring, BPF,</text>
<text x="405" y="869" font-size="10.5" fill="#e8604a" text-anchor="middle">userns, AF_ALG off;</text>
<text x="405" y="882" font-size="10.5" fill="#e8604a" text-anchor="middle">patched at boot</text>
<line x1="417" y1="832" x2="921" y2="832" stroke="#e4e8ee" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="690" y="824" font-size="10.5" fill="#9aa5b6" text-anchor="middle">a working kernel exploit: firewall gone, Mac's loopback reachable</text>
<circle cx="935" cy="832" r="9" fill="#0d1117" stroke="#e8604a" stroke-width="2"/>
<path d="M930,827 L940,837 M940,827 L930,837" stroke="#e8604a" stroke-width="2"/>
<text x="1065" y="836" font-size="10.5" fill="#9aa5b6" text-anchor="middle">your files stay</text>
<text x="1065" y="849" font-size="10.5" fill="#9aa5b6" text-anchor="middle">out of reach</text>
</svg>

